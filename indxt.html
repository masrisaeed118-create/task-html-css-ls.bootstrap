<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    
<div class="parent">
   <header class="div1"><h1>Expense Tracker</h1></header>
    <div class="div2 chip theme-success h-50  d-flex align-items-center justify-content-center">
        <p class="m-0 fs-2xl  ">Total Expenses: <span id="total-expenses"></span></p>
    </div> 

    <div  class="div3 chip theme-accent h-50  d-flex align-items-center justify-content-center">
        <p class="m-0 fs-2xl ">Number of Expenses:  <span id="expense-count"></span></p>
    </div>

    <div class="div4 chip theme-warning h-50  d-flex align-items-center justify-content-center">
        <p class="m-0 fs-2xl ">Biggest Expense: <span id="biggest-expense"></span></p>
    </div>

    <div class="div5">
        <h4 class="d-flex align-items-center justify-content-center">Add New Expense:</h4>
        <form id="expense-form" class="d-grid row-gap-4 column-gap-2">
            <div>
                <label for="expense-description">Description:</label>
                <input type="text" id="expense-description" placeholder="Description"  class="form-control">
                <span class="error-message" id="description-error"></span>
            </div>
            <div>
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" placeholder="Amount"  class="form-control" minlength="0" min="0">
                <span class="error-message" id="amount-error"></span>
            </div>
            <div>
                <label for="category">Category:</label>
                <select id="category"  class="form-control">
                  
                </select>
                <span class="error-message" id="category-error"></span>
            </div>
            <div>
                <label for="expense-date">Date:</label>
                <input type="date" id="expense-date"  class="form-control">
                <span class="error-message " id="date-error"></span>
            </div>
            <button type="submit" class="theme-secondary btn-outline rounded-pill">Add Expense</button>
        </form>
    </div>


    <div class="div6">
        <select id="filter-category" class="form-control">
            <option value="" disabled selected hidden class="form-control">--Filter by category--</option>
        </select>
        <div class="table-card">
        <TABLE id="expense-table" class="table table-hover">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expense-table-body">
                
            </tbody>
        </TABLE>
        </div>
        <span class="error-message fs-2xl" id="table-error"></span>
    </div>

    
    <div class="div7">

    </div>
</div>
    <script src="app.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
